<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ghost Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: rgba(0, 0, 0, 0); /* Fully transparent background */
            color: rgba(255, 255, 255, 0.95);
            padding: 0;
            margin: 0;
            border-radius: 10px;
            overflow: auto;
            user-select: text;
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            width: 100%;
            text-align: center;
            padding-top: 5px;
            padding-bottom: 5px;
            position: sticky;
            top: 0;
            background-color: rgba(40, 40, 40, 0.5); /* Slightly visible header */
            z-index: 100;
        }
        
        .status {
            font-size: 14px;
            padding: 4px 12px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            display: inline-block;
        }
        
        .content {
            flex: 1;
            padding: 5px 10px 10px;
            overflow-y: auto;
            background-color: rgba(0, 0, 0, 0); /* Fully transparent content area */
        }
        
        .answer {
            background-color: rgba(0, 0, 0, 0); /* Fully transparent answer area */
            padding: 5px;
            border-radius: 5px;
            white-space: pre-wrap;
            text-align: left;
            line-height: 1.2; /* Reduced line height */
            font-size: 13px; /* Smaller font size */
        }
        
        .loading {
            text-align: center;
            padding: 10px;
            display: none;
            background-color: rgba(40, 40, 40, 0.5);
            border-radius: 5px;
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        code {
            background-color: rgba(0, 0, 0, 0.4); /* Semi-transparent code background */
            padding: 1px 3px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
        }
        
        pre {
            background-color: rgba(0, 0, 0, 0.4); /* Semi-transparent code block background */
            padding: 5px;
            border-radius: 5px;
            overflow-x: auto;
            font-family: monospace;
            margin: 3px 0;
            font-size: 12px;
            max-width: 100%; /* Ensure code blocks don't exceed container width */
            word-wrap: break-word; /* Allow breaking of very long words */
        }
        
        /* Compact styling for Markdown elements */
        h1, h2, h3, h4, h5, h6 {
            margin-top: 5px;
            margin-bottom: 3px;
            font-size: 14px; /* Smaller heading size */
        }
        
        p {
            margin: 2px 0; /* Minimal paragraph margins */
            max-width: 100%;
            font-size: 13px; /* Smaller paragraph text */
        }
        
        ul, ol {
            margin: 2px 0 2px 15px; /* Reduced list margins */
            padding-left: 5px;
        }
        
        li {
            margin-bottom: 1px; /* Minimal space between list items */
            font-size: 13px;
        }
        
        blockquote {
            border-left: 2px solid rgba(255, 255, 255, 0.3);
            padding-left: 5px;
            margin: 2px 0;
            color: rgba(255, 255, 255, 0.8);
        }
        
        a {
            color: #61dafb;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 5px 0;
            font-size: 12px;
        }
        
        th, td {
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3px;
            text-align: left;
        }
        
        th {
            background-color: rgba(0, 0, 0, 0.3);
        }
        
        tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.1);
        }
        
        /* Direct answer section - with minimal styling */
        .direct-answer {
            padding: 5px;
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            background-color: rgba(0, 0, 0, 0); /* Fully transparent */
            border-radius: 3px;
        }
        
        /* Style to make the answer stand out */
        .direct-answer h1, .direct-answer h2, .direct-answer h3,
        .direct-answer p, .direct-answer code, .direct-answer pre {
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.8); /* Text shadow to improve readability */
        }
        
        /* Step by step styling - more compact */
        .step {
            padding: 3px 5px;
            margin: 2px 0;
            background-color: rgba(40, 40, 40, 0.3);
            border-radius: 3px;
            border-left: 2px solid rgba(100, 180, 255, 0.5);
            font-size: 12px;
        }
        
        /* Status notification style */
        .notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(40, 40, 40, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 1000;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.5s;
            display: flex;
            align-items: center;
        }
        
        .notification.visible {
            opacity: 1;
        }
        
        .notification-icon {
            margin-right: 10px;
        }
        
        /* Typing indicator for streaming responses */
        .typing-indicator {
            display: inline-block;
            margin-left: 5px;
        }
        
        .typing-indicator span {
            display: inline-block;
            width: 5px;
            height: 5px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            margin-right: 3px;
            animation: typing 1s infinite ease-in-out;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="status">Ghost Mode Active</div>
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Processing screenshot...</p>
    </div>
    
    <div class="content" id="content">
        <div class="answer" id="answer"></div>
    </div>
    
    <!-- Notification element -->
    <div class="notification" id="notification">
        <span class="notification-icon">✓</span>
        <span id="notification-text">Screen cleared</span>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const fs = require('fs');
        const { GoogleGenerativeAI } = require('@google/generative-ai');
        const { getRandomPrompt } = require('./prompts');
        const marked = require('marked');
        const remote = require('@electron/remote');
        
        // Initialize the Gemini API
        const apiKey = process.env.GEMINI_API_KEY;
        const genAI = new GoogleGenerativeAI(apiKey);
        
        // Create model with optimized settings
        const modelConfig = {
            model: "gemini-1.5-flash",
            generationConfig: {
                temperature: 0.2, // Lower temperature for faster, more deterministic responses
                topP: 0.8,        // Slightly constrain sampling for faster response
                topK: 40,         // Limit token selection for faster generation
                maxOutputTokens: 2048 // Reasonable limit for coding problems
            },
            safetySettings: [
                // Lower safety settings thresholds for faster processing
                { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_ONLY_HIGH" },
                { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_ONLY_HIGH" },
                { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_ONLY_HIGH" },
                { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_ONLY_HIGH" }
            ]
        };
        
        const model = genAI.getGenerativeModel(modelConfig);
        
        const answerElement = document.getElementById('answer');
        const loadingElement = document.getElementById('loading');
        const contentElement = document.getElementById('content');
        const notificationElement = document.getElementById('notification');
        const notificationTextElement = document.getElementById('notification-text');
        
        // Function to show notification
        function showNotification(message, duration = 1500) {
            notificationTextElement.textContent = message;
            notificationElement.classList.add('visible');
            
            setTimeout(() => {
                notificationElement.classList.remove('visible');
            }, duration);
        }
        
        // Function to clear the screen
        function clearScreen() {
            answerElement.innerHTML = '';
            // Adjust window size to minimum
            const currentWindow = remote.getCurrentWindow();
            const screenWidth = remote.screen.getPrimaryDisplay().workAreaSize.width;
            const screenHeight = remote.screen.getPrimaryDisplay().workAreaSize.height;
            
            // Calculate smaller window size
            const newWidth = 600;
            const newHeight = Math.floor(screenHeight * 0.2);
            
            // Calculate centered position
            const x = Math.floor((screenWidth - newWidth) / 2);
            const y = Math.floor((screenHeight - newHeight) / 2);
            
            currentWindow.setBounds({
                x: x,
                y: y,
                width: newWidth,
                height: newHeight
            });
            
            showNotification('Screen cleared');
        }
        
        // Function to detect code blocks
        function hasCodeBlock(text) {
            return text.includes('```') || text.includes('    ') || /`[^`]+`/.test(text) || 
                  /function\s+\w+\s*\(/.test(text) || /class\s+\w+/.test(text) ||
                  /def\s+\w+\s*\(/.test(text) || /SELECT.*FROM/i.test(text);
        }
        
        // Function to adjust window size based on content
        function adjustWindowSize() {
            const currentWindow = remote.getCurrentWindow();
            const contentHeight = document.body.scrollHeight;
            const screenHeight = remote.screen.getPrimaryDisplay().workAreaSize.height;
            const screenWidth = remote.screen.getPrimaryDisplay().workAreaSize.width;
            
            // Get current window bounds
            const bounds = currentWindow.getBounds();
            
            // Check if content has code blocks
            const contentHasCode = hasCodeBlock(answerElement.innerText || answerElement.textContent);
            
            // Calculate appropriate height (minimum 300px, maximum 75% of screen height)
            let newHeight = Math.min(
                Math.max(contentHeight + 40, 400),  // At least 400px, or content + padding
                Math.floor(screenHeight * 0.75)      // Maximum 75% of screen height
            );
            
            // Calculate width based on content
            let newWidth;
            
            if (contentHasCode) {
                // For content with code, use a wider window
                newWidth = Math.min(Math.floor(screenWidth * 0.7), 1200); // 70% of screen or 1200px max
            } else if (contentHeight > 800) {
                // For long content without code
                newWidth = Math.min(Math.floor(screenWidth * 0.6), 1000);
            } else {
                // For shorter content
                newWidth = Math.min(Math.floor(screenWidth * 0.5), 800);
            }
            
            // Calculate centered position
            const x = Math.floor((screenWidth - newWidth) / 2);
            const y = Math.floor((screenHeight - newHeight) / 2);
            
            // Set new dimensions and position
            currentWindow.setBounds({
                x: x,
                y: y,
                width: newWidth,
                height: newHeight
            });
        }
        
        // Function to check for horizontal overflow
        function checkHorizontalOverflow() {
            // Check if any pre elements are overflowing
            const preElements = document.querySelectorAll('pre');
            let hasOverflow = false;
            
            preElements.forEach(pre => {
                if (pre.scrollWidth > pre.clientWidth) {
                    hasOverflow = true;
                }
            });
            
            if (hasOverflow) {
                // If overflow detected, increase width
                const currentWindow = remote.getCurrentWindow();
                const bounds = currentWindow.getBounds();
                const screenWidth = remote.screen.getPrimaryDisplay().workAreaSize.width;
                
                // Increase by 15% but don't exceed 80% of screen width
                const newWidth = Math.min(
                    Math.floor(bounds.width * 1.15),
                    Math.floor(screenWidth * 0.8)
                );
                
                // Calculate centered X position
                const x = Math.floor((screenWidth - newWidth) / 2);
                
                currentWindow.setBounds({
                    x: x,
                    y: bounds.y,
                    width: newWidth,
                    height: bounds.height
                });
            }
        }
        
        // Format steps for better readability
        function formatSteps(text) {
            // Look for numbered steps (Step 1:, Step 1., 1., 1:, etc.)
            const stepRegex = /(?:step\s*)?(\d+[\.:]\s*)/gi;
            
            // Replace with step formatting
            return text.replace(stepRegex, (match, p1) => {
                return `</p><div class="step"><strong>Step ${p1.replace(/[\.:]\s*$/, '')}:</strong> `;
            }).replace(/<\/div><\/p>/g, '</div>') + '</div>';
        }
        
        // Process and format the response
        function formatPartialResponse(text) {
            // For partial responses, just apply basic formatting
            return marked.parse(text);
        }
        
        // Process and format the complete response
        function formatCompleteResponse(text) {
            // Check for explicit ANSWER/SOLUTION and EXPLANATION/WALKTHROUGH format
            let answerPart = '';
            let explanationPart = '';
            
            if (/ANSWER:|SOLUTION:/i.test(text) && /EXPLANATION:|WALKTHROUGH:/i.test(text)) {
                const parts = text.split(/EXPLANATION:|WALKTHROUGH:/i);
                answerPart = parts[0].replace(/ANSWER:|SOLUTION:/i, '').trim();
                explanationPart = parts[1].trim();
            }
            // Check for numbered format (1. Answer, 2. Explanation)
            else if (/^1[\.)]\s+/.test(text)) {
                const lines = text.split('\n');
                let answerLines = [];
                let explanationLines = [];
                let inAnswer = false;
                let inExplanation = false;
                
                for (const line of lines) {
                    if (line.match(/^1[\.)]\s+/)) {
                        inAnswer = true;
                        answerLines.push(line.replace(/^1[\.)]\s+/, ''));
                    } else if (line.match(/^2[\.)]\s+/)) {
                        inAnswer = false;
                        inExplanation = true;
                        explanationLines.push(line.replace(/^2[\.)]\s+/, ''));
                    } else if (inAnswer) {
                        answerLines.push(line);
                    } else if (inExplanation) {
                        explanationLines.push(line);
                    } else {
                        answerLines.push(line); // Default to answer if structure isn't clear
                    }
                }
                
                answerPart = answerLines.join('\n').trim();
                explanationPart = explanationLines.join('\n').trim();
            }
            // Otherwise, assume first paragraph is the answer, rest is explanation
            else {
                const paragraphs = text.split('\n\n');
                if (paragraphs.length > 1) {
                    answerPart = paragraphs[0].trim();
                    explanationPart = paragraphs.slice(1).join('\n\n').trim();
                } else {
                    // If there's just one paragraph, treat it all as the answer
                    answerPart = text.trim();
                    explanationPart = '';
                }
            }
            
            // Apply step formatting if needed
            let formattedExplanation = explanationPart;
            if (/step\s*\d+|^\d+[\.)]/im.test(explanationPart)) {
                formattedExplanation = '<p>' + formatSteps(explanationPart);
            }
            
            // Convert to HTML
            const answerHtml = marked.parse(answerPart);
            const explanationHtml = marked.parse(formattedExplanation);
            
            return `<div class="direct-answer">${answerHtml}</div>\n\n${explanationHtml}`;
        }
        
        // Function to create typing indicator
        function createTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.innerHTML = '<span></span><span></span><span></span>';
            return indicator;
        }
        
        // Process screenshot with streaming response
        async function processScreenshot(screenshotPath) {
            try {
                // Show loading state
                loadingElement.style.display = 'block';
                contentElement.style.display = 'none';
                answerElement.innerHTML = '';
                
                // Read the screenshot file
                const imageBuffer = fs.readFileSync(screenshotPath);
                const base64Image = imageBuffer.toString('base64');
                
                // Get a random prompt
                const prompt = getRandomPrompt();
                
                // Prepare the parts for the API request
                const imagePart = {
                    inlineData: {
                        data: base64Image,
                        mimeType: "image/png"
                    }
                };
                
                // Hide loading, show content
                loadingElement.style.display = 'none';
                contentElement.style.display = 'block';
                
                // Add typing indicator
                const typingIndicator = createTypingIndicator();
                answerElement.appendChild(typingIndicator);
                
                // Call the Gemini API with streaming
                const result = await model.generateContentStream([prompt, imagePart]);
                
                // Buffer for accumulated text
                let completeText = '';
                let lastUpdateTime = Date.now();
                const updateInterval = 100; // Update UI every 100ms
                
                // Process streaming response
                for await (const chunk of result.stream) {
                    const chunkText = chunk.text();
                    completeText += chunkText;
                    
                    // Update UI periodically to avoid too many DOM operations
                    const currentTime = Date.now();
                    if (currentTime - lastUpdateTime > updateInterval) {
                        // Remove typing indicator before updating content
                        if (answerElement.contains(typingIndicator)) {
                            answerElement.removeChild(typingIndicator);
                        }
                        
                        // Show partial content
                        answerElement.innerHTML = formatPartialResponse(completeText);
                        
                        // Add typing indicator back at the end
                        answerElement.appendChild(typingIndicator);
                        
                        // Adjust window size dynamically
                        adjustWindowSize();
                        
                        lastUpdateTime = currentTime;
                        
                        // Give time for UI to update
                        await new Promise(resolve => setTimeout(resolve, 0));
                    }
                }
                
                // Remove typing indicator
                if (answerElement.contains(typingIndicator)) {
                    answerElement.removeChild(typingIndicator);
                }
                
                // Format final complete response with proper structure
                answerElement.innerHTML = formatCompleteResponse(completeText);
                
                // Final adjustment of window size
                setTimeout(adjustWindowSize, 100);
                
                // Check for horizontal overflow and adjust if needed
                setTimeout(checkHorizontalOverflow, 300);
                
                // After formatting final response and adjusting size, center the window
                setTimeout(() => {
                    centerWindowOnScreen();
                }, 350);
                
            } catch (error) {
                console.error('Error processing screenshot:', error);
                answerElement.textContent = `Error processing screenshot: ${error.message}`;
                loadingElement.style.display = 'none';
                contentElement.style.display = 'block';
            }
        }
        
        // Listen for screenshot processing request
        ipcRenderer.on('process-screenshot', async (event, screenshotPath) => {
            processScreenshot(screenshotPath);
        });
        
        // Listen for clear screen command
        ipcRenderer.on('clear-screen', () => {
            clearScreen();
        });
        
        // Listen for screenshot errors
        ipcRenderer.on('screenshot-error', (event, errorMessage) => {
            answerElement.textContent = `Error capturing screenshot: ${errorMessage}`;
            loadingElement.style.display = 'none';
            contentElement.style.display = 'block';
        });

        // Function to center window using IPC
        async function centerWindowOnScreen() {
            try {
                await ipcRenderer.invoke('center-window');
            } catch (error) {
                console.error('Error centering window:', error);
            }
        }
    </script>
</body>
</html>
