<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleGhost</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.5 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; min-height: 100vh; color: #f6f7fb; background: transparent; }
    .shell { min-height: calc(100vh - 24px); overflow: hidden; border: 1px solid rgba(255,255,255,.12); border-radius: 16px; background: rgba(17,19,25,.94); box-shadow: 0 20px 60px rgba(0,0,0,.42); backdrop-filter: blur(24px); }
    header { display: flex; align-items: center; gap: 10px; padding: 11px 15px; border-bottom: 1px solid rgba(255,255,255,.09); background: rgba(255,255,255,.035); -webkit-app-region: drag; user-select: none; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #65d38e; box-shadow: 0 0 12px rgba(101,211,142,.8); }
    #status { font-weight: 650; }
    #model { margin-left: auto; color: #9299aa; font-size: 12px; }
    .actions { display: flex; gap: 6px; -webkit-app-region: no-drag; }
    button { padding: 5px 9px; border: 1px solid rgba(255,255,255,.14); border-radius: 7px; color: #e9ebf1; background: rgba(255,255,255,.07); font: inherit; font-size: 12px; cursor: pointer; }
    button:hover { background: rgba(255,255,255,.13); }
    button:focus-visible { outline: 2px solid #8bc5ff; outline-offset: 1px; }
    main { padding: 18px 20px 22px; overflow: auto; }
    #empty-state { color: #b8bfcc; }
    #empty-state strong { color: #fff; }
    .shortcuts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    kbd { padding: 3px 7px; border: 1px solid rgba(255,255,255,.16); border-radius: 6px; color: #e9ebf1; background: rgba(255,255,255,.07); box-shadow: 0 1px 0 rgba(255,255,255,.1) inset; font: inherit; font-size: 12px; }
    #loading { color: #cbd0db; }
    #loading::after { content: ""; animation: dots 1.2s steps(4,end) infinite; }
    @keyframes dots { 25% { content: "."; } 50% { content: ".."; } 75%,100% { content: "..."; } }
    #answer { overflow-wrap: anywhere; }
    #answer > :first-child { margin-top: 0; }
    #answer > :last-child { margin-bottom: 0; }
    h1, h2, h3 { line-height: 1.25; margin: 1.1em 0 .45em; }
    h1 { font-size: 20px; } h2 { font-size: 17px; } h3 { font-size: 15px; }
    p, ul, ol { margin: .6em 0; }
    pre { padding: 13px; overflow: auto; border: 1px solid rgba(255,255,255,.1); border-radius: 9px; background: #0c0e13; }
    code { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12.5px; }
    :not(pre) > code { padding: 2px 5px; border-radius: 5px; background: rgba(255,255,255,.09); }
    a { color: #8bc5ff; }
    blockquote { margin-left: 0; padding-left: 12px; border-left: 3px solid #5879a8; color: #c1c7d2; }
    .error { padding: 11px 13px; border: 1px solid rgba(255,100,100,.35); border-radius: 9px; color: #ffd4d4; background: rgba(145,38,38,.25); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <section class="shell">
    <header>
      <span class="dot" aria-hidden="true"></span><span id="status">Ready</span><span id="model"></span>
      <div class="actions">
        <button type="button" data-action="analyse">Analyse</button>
        <button type="button" data-action="clear">Clear</button>
        <button type="button" data-action="hide">Hide</button>
        <button type="button" data-action="quit">Quit</button>
      </div>
    </header>
    <main>
      <div id="empty-state">
        <strong>SimpleGhost is ready.</strong> Use it for practice sessions on content you’re allowed to capture.
        <div class="shortcuts"><kbd>⌘/Ctrl + 1 · Analyse</kbd><kbd>⌘/Ctrl + 2 · Clear</kbd><kbd>⌘/Ctrl + Shift + H · Hide</kbd><kbd>⌘/Ctrl + Shift + W · Quit</kbd></div>
      </div>
      <div id="loading" hidden>Analysing screenshot</div>
      <article id="answer" hidden></article>
    </main>
  </section>
  <script type="module" src="renderer.js"></script>
</body>
</html>
