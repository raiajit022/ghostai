<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ghost Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: rgba(51, 51, 51, 0.3); /* Very translucent background */
            color: rgba(255, 255, 255, 0.95);
            padding: 0;
            margin: 0;
            border-radius: 15px;
            overflow: auto;
            user-select: text;
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            width: 100%;
            text-align: center;
            padding-top: 10px;
            padding-bottom: 10px;
            position: sticky;
            top: 0;
            background-color: rgba(51, 51, 51, 0.6);
            z-index: 100;
        }
        
        .status {
            font-size: 16px;
            padding: 6px 16px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            display: inline-block;
        }
        
        .content {
            flex: 1;
            padding: 10px 20px 20px;
            overflow-y: auto;
        }
        
        .answer {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 10px;
            white-space: pre-wrap;
            text-align: left;
            line-height: 1.4;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #ffffff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        code {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
        }
        
        pre {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: monospace;
            margin: 5px 0;
        }
        
        /* Compact styling for Markdown elements */
        h1, h2, h3, h4, h5, h6 {
            margin-top: 10px;
            margin-bottom: 5px;
        }
        
        p {
            margin: 5px 0;
            max-width: 100%;
        }
        
        ul, ol {
            margin: 5px 0 5px 20px;
            padding-left: 10px;
        }
        
        li {
            margin-bottom: 3px;
        }
        
        blockquote {
            border-left: 4px solid rgba(255, 255, 255, 0.3);
            padding-left: 10px;
            margin: 5px 0;
            color: rgba(255, 255, 255, 0.8);
        }
        
        a {
            color: #61dafb;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
        }
        
        th, td {
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px;
            text-align: left;
        }
        
        th {
            background-color: rgba(0, 0, 0, 0.4);
        }
        
        tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.2);
        }
        
        /* Direct answer section - with subtle styling to make it visible but not obstructive */
        .direct-answer {
            padding: 10px;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            background-color: rgba(70, 70, 70, 0.3);
            border-radius: 6px;
        }
        
        /* Style to make the answer stand out */
        .direct-answer h1, .direct-answer h2, .direct-answer h3,
        .direct-answer p, .direct-answer code, .direct-answer pre {
            color: rgba(255, 255, 255, 1);
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }
        
        /* Step by step styling */
        .step {
            padding: 6px 10px;
            margin: 4px 0;
            background-color: rgba(60, 60, 60, 0.3);
            border-radius: 4px;
            border-left: 3px solid rgba(100, 180, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="status">Ghost Mode Active</div>
    </div>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Processing screenshot...</p>
    </div>
    
    <div class="content" id="content">
        <div class="answer" id="answer"></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const fs = require('fs');
        const { GoogleGenerativeAI } = require('@google/generative-ai');
        const { getRandomPrompt } = require('./prompts');
        const marked = require('marked');
        const remote = require('@electron/remote');
        
        // Initialize the Gemini API
        const apiKey = process.env.GEMINI_API_KEY;
        const genAI = new GoogleGenerativeAI(apiKey);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
        
        const answerElement = document.getElementById('answer');
        const loadingElement = document.getElementById('loading');
        const contentElement = document.getElementById('content');
        
        // Function to adjust window size based on content
        function adjustWindowSize() {
            const currentWindow = remote.getCurrentWindow();
            const contentHeight = document.body.scrollHeight;
            const screenHeight = remote.screen.getPrimaryDisplay().workAreaSize.height;
            
            // Get current window bounds
            const bounds = currentWindow.getBounds();
            
            // Calculate appropriate height (minimum 400px, maximum 80% of screen height)
            let newHeight = Math.min(
                Math.max(contentHeight + 40, 400),  // At least 400px, or content + padding
                Math.floor(screenHeight * 0.8)      // Maximum 80% of screen height
            );
            
            // Adjust width based on content length
            let newWidth = bounds.width;
            if (contentHeight > 1000) {
                // For really long content, make it a bit wider
                newWidth = Math.min(Math.floor(remote.screen.getPrimaryDisplay().workAreaSize.width * 0.7), 1200);
            }
            else if (contentHeight < 500) {
                // For short content, make it narrower
                newWidth = Math.min(700, bounds.width);
            }
            
            // Set new dimensions
            currentWindow.setBounds({
                x: bounds.x,
                y: bounds.y,
                width: newWidth,
                height: newHeight
            });
        }
        
        // Format steps for better readability
        function formatSteps(text) {
            // Look for numbered steps (Step 1:, Step 1., 1., 1:, etc.)
            const stepRegex = /(?:step\s*)?(\d+[\.:]\s*)/gi;
            
            // Replace with step formatting
            return text.replace(stepRegex, (match, p1) => {
                return `</p><div class="step"><strong>Step ${p1.replace(/[\.:]\s*$/, '')}:</strong> `;
            }).replace(/<\/div><\/p>/g, '</div>') + '</div>';
        }
        
        // Process and format the response
        function formatResponse(text) {
            // Check for explicit ANSWER/SOLUTION and EXPLANATION/WALKTHROUGH format
            let answerPart = '';
            let explanationPart = '';
            
            if (/ANSWER:|SOLUTION:/i.test(text) && /EXPLANATION:|WALKTHROUGH:/i.test(text)) {
                const parts = text.split(/EXPLANATION:|WALKTHROUGH:/i);
                answerPart = parts[0].replace(/ANSWER:|SOLUTION:/i, '').trim();
                explanationPart = parts[1].trim();
            }
            // Check for numbered format (1. Answer, 2. Explanation)
            else if (/^1[\.)]\s+/.test(text)) {
                const lines = text.split('\n');
                let answerLines = [];
                let explanationLines = [];
                let inAnswer = false;
                let inExplanation = false;
                
                for (const line of lines) {
                    if (line.match(/^1[\.)]\s+/)) {
                        inAnswer = true;
                        answerLines.push(line.replace(/^1[\.)]\s+/, ''));
                    } else if (line.match(/^2[\.)]\s+/)) {
                        inAnswer = false;
                        inExplanation = true;
                        explanationLines.push(line.replace(/^2[\.)]\s+/, ''));
                    } else if (inAnswer) {
                        answerLines.push(line);
                    } else if (inExplanation) {
                        explanationLines.push(line);
                    } else {
                        answerLines.push(line); // Default to answer if structure isn't clear
                    }
                }
                
                answerPart = answerLines.join('\n').trim();
                explanationPart = explanationLines.join('\n').trim();
            }
            // Otherwise, assume first paragraph is the answer, rest is explanation
            else {
                const paragraphs = text.split('\n\n');
                if (paragraphs.length > 1) {
                    answerPart = paragraphs[0].trim();
                    explanationPart = paragraphs.slice(1).join('\n\n').trim();
                } else {
                    // If there's just one paragraph, treat it all as the answer
                    answerPart = text.trim();
                    explanationPart = '';
                }
            }
            
            // Apply step formatting if needed
            let formattedExplanation = explanationPart;
            if (/step\s*\d+|^\d+[\.)]/im.test(explanationPart)) {
                formattedExplanation = '<p>' + formatSteps(explanationPart);
            }
            
            // Convert to HTML
            const answerHtml = marked.parse(answerPart);
            const explanationHtml = marked.parse(formattedExplanation);
            
            return `<div class="direct-answer">${answerHtml}</div>\n\n${explanationHtml}`;
        }
        
        // Listen for screenshot processing request
        ipcRenderer.on('process-screenshot', async (event, screenshotPath) => {
            try {
                // Show loading state
                loadingElement.style.display = 'block';
                contentElement.style.display = 'none';
                answerElement.innerHTML = '';
                
                // Read the screenshot file
                const imageBuffer = fs.readFileSync(screenshotPath);
                const base64Image = imageBuffer.toString('base64');
                
                // Get a random prompt
                const prompt = getRandomPrompt();
                
                // Prepare the parts for the API request
                const imagePart = {
                    inlineData: {
                        data: base64Image,
                        mimeType: "image/png"
                    }
                };
                
                // Call the Gemini API
                const result = await model.generateContent([prompt, imagePart]);
                const response = await result.response;
                const text = response.text();
                
                // Format and display the answer
                answerElement.innerHTML = formatResponse(text);
                
                // Hide loading state and show content
                loadingElement.style.display = 'none';
                contentElement.style.display = 'block';
                
                // Adjust window size after content is loaded
                setTimeout(adjustWindowSize, 100);
                
            } catch (error) {
                console.error('Error processing screenshot:', error);
                answerElement.textContent = `Error processing screenshot: ${error.message}`;
                loadingElement.style.display = 'none';
                contentElement.style.display = 'block';
            }
        });
        
        // Listen for screenshot errors
        ipcRenderer.on('screenshot-error', (event, errorMessage) => {
            answerElement.textContent = `Error capturing screenshot: ${errorMessage}`;
            loadingElement.style.display = 'none';
            contentElement.style.display = 'block';
        });
    </script>
</body>
</html>
